<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark light">
  <title>JUEGO</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233987e5'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%230b0c0e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="JUEGO home"><span class="brand-mark" aria-hidden="true"></span>JUEGO</a>
      <nav class="nav" aria-label="Sections">
        <a href="#/" data-nav="overview">Overview</a>
        <a href="#/players" data-nav="players">Players</a>
        <a href="#/compare" data-nav="compare">Compare</a>
        <a href="#/teams" data-nav="teams">Teams</a>
        <a href="#/match-lab" data-nav="match-lab">Match Lab</a>
        <a href="#/scouting" data-nav="scouting">Scouting</a>
        <a href="#/transfers" data-nav="transfers">Transfers</a>
        <a href="#/models" data-nav="models">Models</a>
      </nav>
      <div class="search" role="search">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.6 3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Search players or clubs" autocomplete="off" spellcheck="false" aria-label="Search players or clubs">
        <div class="search-results" id="search-results" role="listbox"></div>
      </div>
      <button class="theme-toggle press" id="theme" aria-label="Toggle light or dark appearance" title="Appearance">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.8a6.2 6.2 0 0 1 0 12.4z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>
  <main id="app" aria-live="polite"></main>
  <footer class="foot">
    <span>JUEGO runs locally. No accounts, cookies, tracking or search history.</span>
    <span id="foot-meta"></span>
  </footer>
</body>
</html>
